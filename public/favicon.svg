<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#DB2777" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FBCFE8" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect width="128" height="128" rx="32" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="124" height="124" rx="30" fill="none" stroke="#F472B6" stroke-opacity="0.35" stroke-width="2.5" />

  <!-- Monogram AS -->
  <text 
    x="60" 
    y="86" 
    font-family="Playfair Display, Fraunces, Georgia, 'Times New Roman', serif" 
    font-size="64" 
    font-weight="800" 
    letter-spacing="-2"
    text-anchor="middle" 
    fill="url(#pinkGrad)"
  >AS</text>

  <!-- Crystal Sparkle on Top-Right -->
  <path d="M 98 26 Q 98 38 108 38 Q 98 38 98 50 Q 98 38 88 38 Q 98 38 98 26 Z" fill="url(#sparkleGrad)" />
  <circle cx="98" cy="38" r="2" fill="#FFFFFF" />
</svg>
