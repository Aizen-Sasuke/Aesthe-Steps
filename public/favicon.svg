<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#DB2777" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FBCFE8" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect width="128" height="128" rx="32" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="124" height="124" rx="30" fill="none" stroke="#F472B6" stroke-opacity="0.35" stroke-width="2.5" />

  <!-- Fine Jewelry Interlocking AS Monogram in Glowing Brand Pink -->
  <g transform="translate(12.8, 12.8) scale(1.6)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Letter S - Upper Arch and Spine -->
    <path stroke="url(#pinkGrad)" d="M 46.5 18 C 45 13.5 37.5 13 31.5 18 C 25.5 22.5 27 30 33 33.5" stroke-width="2.3" fill="none" />
    
    <!-- Letter A - Left Leg (Hairline) -->
    <line stroke="url(#pinkGrad)" x1="26" y1="14" x2="24.5" y2="19" stroke-width="1.7" />
    <line stroke="url(#pinkGrad)" x1="23.2" y1="23" x2="15.5" y2="49" stroke-width="1.7" />
    
    <!-- Letter A - Serifs & Crossbar -->
    <line stroke="url(#pinkGrad)" x1="12" y1="49" x2="19.5" y2="49" stroke-width="1.7" />
    <line stroke="url(#pinkGrad)" x1="23" y1="14" x2="29.5" y2="14" stroke-width="1.7" />
    <line stroke="url(#pinkGrad)" x1="19.5" y1="37" x2="34" y2="37" stroke-width="1.6" />
    
    <!-- Letter S - Lower Bowl (Weaves behind A's right stem) -->
    <path stroke="url(#pinkGrad)" d="M 38 41 C 43 44 41 49 35.5 50.5 C 30 52 25 49.5 22.5 45.5" stroke-width="2.3" fill="none" />

    <!-- Letter A - Right Leg (Main Weighted Stem) -->
    <line stroke="url(#pinkGrad)" x1="26.5" y1="14" x2="38.5" y2="49" stroke-width="2.8" />
    <line stroke="url(#pinkGrad)" x1="34" y1="49" x2="42.5" y2="49" stroke-width="1.7" />

    <!-- S Terminals -->
    <circle fill="url(#pinkGrad)" cx="46.5" cy="18" r="1.6" />
    <circle fill="url(#pinkGrad)" cx="22.5" cy="45.5" r="1.6" />

    <!-- Signature Crystal Sparkle Accent -->
    <path fill="url(#sparkleGrad)" d="M 49 8.5 Q 49 12.5 53 12.5 Q 49 12.5 49 16.5 Q 49 12.5 45 12.5 Q 49 12.5 49 8.5 Z" />
    <circle fill="#FFFFFF" cx="49" cy="12.5" r="0.6" />
  </g>
</svg>
