<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" width="240" height="64" fill="none">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,500;1,600&amp;family=Plus+Jakarta+Sans:wght@500;600&amp;display=swap');
    .logo-wordmark {
      font-family: 'Playfair Display', Georgia, serif;
      font-style: italic;
      font-weight: 500;
      font-size: 32px;
      fill: #18181B;
      letter-spacing: -0.01em;
    }
    .logo-tagline {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 0.24em;
      fill: #52525B;
      text-transform: uppercase;
    }
    @media (prefers-color-scheme: dark) {
      .logo-wordmark { fill: #FAF6F0; }
      .logo-tagline { fill: #A1A1AA; }
    }
  </style>
  <text x="2" y="34" class="logo-wordmark">Aesthé Steps</text>
  <text x="4" y="52" class="logo-tagline">WALK AESTHETIC</text>
</svg>
